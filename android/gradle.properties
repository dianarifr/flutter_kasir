# Jatah RAM sengaja kecil: laptop ini 11 GB dan build sebelumnya (8 GB heap
# + 4 GB metaspace) memicu OOM killer sampai VS Code dibunuh & sistem lag.
# Proyek ini kecil — build release 3 ABI hanya butuh ~2 menit dengan 2 GB.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Paralel + cache mengganti sebagian kecepatan yang hilang dari heap kecil.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
# Kotlin daemon punya JVM sendiri; batasi agar total tidak balik menekan RAM.
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false